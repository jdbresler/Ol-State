<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ol' State Pick'em — 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#041E42;
    --navy-2:#0A2A56;
    --white:#FFFFFF;
    --steel:#1E4D8C;
    --chalk:#EEF1F6;
    --card:#FFFFFF;
    --ink:#12172B;
    --sub:#5A6072;
    --amber:#D8AE43;
    --correct:#1F7A46;
    --incorrect:#A63333;
    --line:#D7DCE6;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--chalk);color:var(--ink);}
  h1,h2,h3,.display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.04em;}
  .mono{font-family:'Roboto Mono',monospace;}

  .gate{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.04), transparent 40%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 120px),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
    padding:24px;
  }
  .gate-card{
    background:var(--white); border-radius:6px; padding:40px 36px; width:100%; max-width:380px;
    box-shadow:0 30px 60px rgba(0,0,0,0.35); text-align:center;
  }
  .gate-eyebrow{color:var(--steel);font-family:'Oswald',sans-serif;letter-spacing:0.18em;font-size:12px;font-weight:600;}
  .gate-title{font-size:26px;margin:6px 0 24px;color:var(--navy);font-weight:700;}
  .gate input[type=password], .gate input[type=text]{
    width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:4px;font-size:16px;
    font-family:'Inter',sans-serif;margin-bottom:14px;outline:none;
  }
  .gate input:focus{border-color:var(--steel);}
  .btn{
    background:var(--navy);color:var(--white);border:none;border-radius:4px;padding:12px 18px;
    font-family:'Oswald',sans-serif;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;
    font-size:14px;cursor:pointer;width:100%;transition:background 0.15s;
  }
  .btn:hover{background:var(--steel);}
  .btn:disabled{background:#aab2c2;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--steel);border:2px solid var(--steel);}
  .btn-ghost:hover{background:var(--steel);color:#fff;}
  .btn-text{background:none;border:none;color:var(--steel);font-size:12.5px;cursor:pointer;text-decoration:underline;font-family:'Inter';margin-top:6px;}
  .error-msg{color:var(--incorrect);font-size:13px;margin-top:-6px;margin-bottom:14px;min-height:16px;}
  .name-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;}
  .name-btn{
    padding:18px 8px;border:2px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;
    font-family:'Oswald',sans-serif;font-size:16px;letter-spacing:0.03em;color:var(--navy);font-weight:600;
    transition:all 0.15s;
  }
  .name-btn:hover{border-color:var(--navy);background:var(--chalk);}

  .app{display:none;min-height:100vh;flex-direction:column;}
  header.top{
    background:linear-gradient(180deg,var(--navy) 0%, var(--navy-2) 100%);
    color:#fff;padding:14px 20px 0;position:sticky;top:0;z-index:20;
    box-shadow:0 4px 16px rgba(0,0,0,0.2);
  }
  .top-row{display:flex;align-items:center;justify-content:space-between;max-width:1000px;margin:0 auto;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:50%;background:var(--white);color:var(--navy);
    display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:700;font-size:16px;
    border:2px solid var(--amber);
  }
  .brand-text{font-size:18px;font-weight:700;letter-spacing:0.05em;}
  .brand-sub{font-size:10px;color:#9FB2D6;letter-spacing:0.15em;font-weight:400;text-transform:uppercase;}
  .who{font-size:13px;color:#D7E1F5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .who button{background:none;border:1px solid rgba(255,255,255,0.35);color:#fff;padding:5px 10px;border-radius:4px;font-size:12px;cursor:pointer;font-family:'Inter';}
  .who button:hover{background:rgba(255,255,255,0.12);}
  .admin-chip{background:var(--amber);color:#3a2c00;font-family:'Oswald';font-size:10.5px;padding:3px 8px;border-radius:3px;letter-spacing:0.06em;text-transform:uppercase;font-weight:700;}

  nav.tabs{max-width:1000px;margin:14px auto 0;display:flex;gap:4px;}
  nav.tabs button{
    flex:1;background:transparent;border:none;color:#B9C7E6;padding:12px 8px;cursor:pointer;
    font-family:'Oswald';letter-spacing:0.07em;font-size:13px;text-transform:uppercase;font-weight:600;
    border-bottom:3px solid transparent;
  }
  nav.tabs button.active{color:#fff;border-bottom:3px solid var(--amber);}

  main{max-width:1000px;margin:0 auto;padding:22px 16px 60px;width:100%;}

  .scoreboard{
    background:linear-gradient(180deg,#08152E,#020B1C);
    border:1px solid #142A54;border-radius:8px;color:var(--amber);padding:18px 20px;margin-bottom:24px;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
    box-shadow:inset 0 0 30px rgba(0,0,0,0.5);
  }
  .scoreboard .sb-label{color:#7C93BE;font-family:'Oswald';font-size:11px;letter-spacing:0.2em;text-transform:uppercase;}
  .scoreboard .sb-main{font-family:'Roboto Mono';font-size:22px;font-weight:700;letter-spacing:0.02em;}
  .scoreboard .sb-sub{font-family:'Roboto Mono';font-size:13px;color:#E8D28A;}

  .section-title{display:flex;align-items:center;gap:12px;margin:28px 0 14px;}
  .section-title h2{font-size:18px;color:var(--navy);margin:0;}
  .section-title .rule{flex:1;height:0;border-top:2px dashed #C3CCDC;}

  .card{
    background:var(--card);border-radius:6px;border:1px solid var(--line);
    box-shadow:0 1px 3px rgba(10,20,50,0.06);margin-bottom:14px;overflow:hidden;
  }
  .card-head{
    display:flex;justify-content:space-between;align-items:center;padding:14px 18px;
    border-left:5px solid var(--steel);gap:10px;flex-wrap:wrap;
  }
  .card.final .card-head{border-left-color:var(--correct);}
  .gh-left{display:flex;flex-direction:column;gap:2px;}
  .wk{font-family:'Oswald';font-size:11px;letter-spacing:0.14em;color:var(--sub);text-transform:uppercase;}
  .matchup{font-family:'Oswald';font-size:19px;font-weight:600;color:var(--navy);}
  .meta{font-size:12.5px;color:var(--sub);margin-top:2px;}
  .tv-badge{
    background:var(--navy);color:#fff;font-family:'Oswald';font-size:11px;padding:5px 10px;border-radius:3px;
    letter-spacing:0.06em;white-space:nowrap;
  }
  .card-body{padding:0 18px 16px;}
  .line-row{display:flex;gap:22px;flex-wrap:wrap;padding:10px 0;border-top:1px solid #F0F2F7;font-size:13.5px;}
  .line-item{color:var(--sub);}
  .line-item b{color:var(--ink);font-family:'Roboto Mono';}
  .final-score{
    font-family:'Roboto Mono';font-size:26px;font-weight:700;color:var(--navy);display:flex;gap:14px;align-items:baseline;
  }
  .result-tag{font-family:'Oswald';font-size:11.5px;padding:3px 8px;border-radius:3px;letter-spacing:0.05em;text-transform:uppercase;}
  .result-tag.psu{background:#E4EEFF;color:var(--steel);}
  .result-tag.opp{background:#FBEAEA;color:var(--incorrect);}
  .result-tag.push{background:#F1F1F1;color:#777;}

  .admin-controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
  .small-btn{
    background:var(--navy);color:#fff;border:none;border-radius:4px;padding:9px 14px;font-family:'Oswald';
    font-size:12.5px;letter-spacing:0.05em;text-transform:uppercase;cursor:pointer;white-space:nowrap;
  }
  .small-btn:hover{background:var(--steel);}
  .small-btn.ghost{background:transparent;color:var(--steel);border:1.5px solid var(--steel);}
  .small-btn.ghost:hover{background:var(--steel);color:#fff;}
  .edit-box{background:#F7F9FC;border:1px dashed var(--line);border-radius:5px;padding:12px;margin-top:10px;}
  .edit-row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:0.05em;}
  .field input{padding:8px 10px;border:1px solid var(--line);border-radius:4px;font-size:14px;width:110px;font-family:'Roboto Mono';}

  .pick-options{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;}
  .pick-opt{
    flex:1;min-width:140px;border:2px solid var(--line);border-radius:6px;padding:12px 14px;background:#fff;
    cursor:pointer;text-align:left;font-family:'Inter';
  }
  .pick-opt:hover{border-color:var(--steel);}
  .pick-opt.selected{border-color:var(--navy);background:#EAF0FB;}
  .pick-opt .po-title{font-family:'Oswald';font-size:14px;color:var(--navy);font-weight:600;}
  .pick-opt .po-sub{font-size:11.5px;color:var(--sub);margin-top:2px;}
  .pick-group-label{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--sub);margin-top:14px;margin-bottom:2px;font-weight:600;}
  .save-row{margin-top:14px;display:flex;align-items:center;gap:12px;}
  .save-row .btn{width:auto;padding:10px 22px;}
  .locked-note{font-size:12.5px;color:var(--correct);font-weight:600;}

  .status-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center;}
  .avatar{
    width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:'Oswald';font-size:12px;font-weight:700;border:2px solid var(--line);color:var(--sub);background:#fff;
  }
  .avatar.in{border-color:var(--correct);color:var(--correct);background:#EAF6EE;}
  .status-note{font-size:12.5px;color:var(--sub);}

  .reveal-grid{margin-top:12px;border-top:1px solid #F0F2F7;padding-top:12px;}
  table.reveal{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.reveal th{text-align:left;color:var(--sub);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;padding:6px 8px;border-bottom:1px solid var(--line);}
  table.reveal td{padding:8px;border-bottom:1px solid #F3F4F8;}
  table.reveal td.player-cell{display:flex;align-items:center;gap:8px;}

  .empty-note{color:var(--sub);font-size:13.5px;font-style:italic;padding:6px 0;}

  .stand-card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:12px;}
  .stand-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .stand-name{font-family:'Oswald';font-size:17px;color:var(--navy);font-weight:600;display:flex;align-items:center;gap:8px;}
  .rank-badge{
    width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;
    display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:700;
  }
  .rank-badge.gold{background:var(--amber);color:#3a2c00;}
  .stand-pts{font-family:'Roboto Mono';font-size:22px;font-weight:700;color:var(--navy);}
  .bar-outer{height:14px;background:#EEF1F6;border-radius:7px;overflow:hidden;display:flex;}
  .bar-ats{background:var(--steel);height:100%;}
  .bar-ou{background:var(--amber);height:100%;}
  .stand-legend{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--sub);}
  .legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;position:relative;top:1px;}

  .footer-note{text-align:center;color:var(--sub);font-size:12px;margin-top:30px;padding-top:16px;border-top:1px solid var(--line);}
  .danger-link{color:var(--incorrect);background:none;border:none;font-size:11.5px;cursor:pointer;text-decoration:underline;font-family:'Inter';}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(4,30,66,0.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal-backdrop.show{display:flex;}
  .modal-card{background:#fff;border-radius:8px;padding:28px;max-width:360px;width:100%;}
  .modal-card h3{color:var(--navy);font-size:18px;margin:0 0 16px;}
  .modal-card input{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:4px;margin-bottom:12px;font-size:14px;font-family:'Inter';}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .modal-actions .btn{width:auto;flex:1;}

  @media (max-width:560px){
    .name-grid{grid-template-columns:1fr;}
    .matchup{font-size:16px;}
    .final-score{font-size:20px;}
  }
</style>
</head>

<div class="gate" id="gate-name">

          <div class="brand-text">Ol' State Pick'em</div>

        <span>Picking as <b id="who-name"></b></span>

        <button onclick="openChangePassword()">Change Password</button>

<!-- CHANGE PASSWORD MODAL -->
<div class="modal-backdrop" id="pw-modal">

    <input type="password" id="cp-new" placeholder="New password">
    <input type="password" id="cp-confirm" placeholder="Confirm new password">
    <div class="error-msg" id="cp-error"></div>

      <button class="btn btn-ghost" onclick="closeChangePassword()">Cancel</button>
      <button class="btn" onclick="submitChangePassword()">Save</button>

  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

  const firebaseConfig = {

    authDomain: "ol--state.firebaseapp.com",
    projectId: "ol--state",
    storageBucket: "ol--state.firebasestorage.app",
    messagingSenderId: "1077093957678",
    appId: "1:1077093957678:web:9924259461fc655af5dfbf"
  };

  const fbApp = initializeApp(firebaseConfig);
  const db = getFirestore(fbApp);

  // Expose a tiny bridge so the classic (non-module) script below can talk to Firestore
  window.__fb = {
    docRef: (name) => doc(db, 'psu-pickem', name),
    getDoc,
    setDoc,
    ready: true
  };
</script>

const ADMIN_NAME = "JB";
const DEFAULT_AUTH = { "Bev":"bev2026", "JB":"jb2026", "WC":"wc2026", "Weav":"weav2026" };

const DEFAULT_GAMES = [

];

let currentUser = null;

let auth = {};
let games = [];
let picks = {};

let editingScore = {};

// ---------------- STORAGE (Firestore) ----------------
function waitForFirebase(){
  return new Promise(resolve=>{
    if(window.__fb && window.__fb.ready) return resolve();
    const iv = setInterval(()=>{
      if(window.__fb && window.__fb.ready){ clearInterval(iv); resolve(); }
    }, 50);
  });
}
async function loadAuth(){
  await waitForFirebase();
  try{
    const snap = await window.__fb.getDoc(window.__fb.docRef('auth'));
    if(snap.exists()) return snap.data().value;
    await window.__fb.setDoc(window.__fb.docRef('auth'), {value: DEFAULT_AUTH});
    return {...DEFAULT_AUTH};
  }catch(e){
    console.error('loadAuth failed', e);
    alert('Could not connect to the database — check your internet connection and reload.');
    return {...DEFAULT_AUTH};
  }
}
async function saveAuth(){
  try{ await window.__fb.setDoc(window.__fb.docRef('auth'), {value: auth}); }
  catch(e){ console.error('save auth failed', e); alert('Could not save password — check connection and try again.'); }
}
async function loadGames(){
  await waitForFirebase();
  try{
    const snap = await window.__fb.getDoc(window.__fb.docRef('games'));
    if(snap.exists()) return snap.data().value;
    await window.__fb.setDoc(window.__fb.docRef('games'), {value: DEFAULT_GAMES});
    return JSON.parse(JSON.stringify(DEFAULT_GAMES));
  }catch(e){
    console.error('loadGames failed', e);
    alert('Could not connect to the database — check your internet connection and reload.');
    return JSON.parse(JSON.stringify(DEFAULT_GAMES));
  }
}
async function saveGames(){
  try{ await window.__fb.setDoc(window.__fb.docRef('games'), {value: games}); }
  catch(e){ console.error('save games failed', e); alert('Could not save — check connection and try again.'); }
}
async function loadPicks(){
  await waitForFirebase();
  try{
    const snap = await window.__fb.getDoc(window.__fb.docRef('picks'));
    if(snap.exists()) return snap.data().value;
    await window.__fb.setDoc(window.__fb.docRef('picks'), {value: {}});
    return {};
  }catch(e){
    console.error('loadPicks failed', e);
    alert('Could not connect to the database — check your internet connection and reload.');
    return {};
  }
}
async function savePicks(){
  try{ await window.__fb.setDoc(window.__fb.docRef('picks'), {value: picks}); }
  catch(e){ console.error('save picks failed', e); alert('Could not save your pick — check connection and try again.'); }
}

  auth = await loadAuth();
  const grid = document.getElementById('name-grid');

  document.getElementById('gate-name').style.display = 'none';

function backToNames(){

  document.getElementById('gate-name').style.display = 'flex';
}
async function checkPassword(){
  const val = document.getElementById('pw-input').value;

    currentUser = pendingName;

  document.getElementById('app').style.display = 'none';

}

async function bootData(){
  document.getElementById('main-content').innerHTML = `<div style="text-align:center;padding:60px 0;color:#5A6072;">Loading season data…</div>`;

  document.getElementById('cp-current').value = '';
  document.getElementById('cp-new').value = '';

async function submitChangePassword(){
  const cur = document.getElementById('cp-current').value;
  const nw = document.getElementById('cp-new').value;

  const errEl = document.getElementById('cp-error');

// ---------------- TAB SWITCHING ----------------
function setTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  render();
}

// ---------------- RESULT HELPERS ----------------
function atsResult(g){
  if(g.status!=='final' || g.psuLine===null || g.psuLine===undefined || g.psuScore===null || g.oppScore===null) return null;
  const adj = (g.psuScore - g.oppScore) + Number(g.psuLine);
  if(adj > 0) return 'PSU';
  if(adj < 0) return 'OPP';
  return 'PUSH';
}
function ouResult(g){
  if(g.status!=='final' || g.total===null || g.total===undefined || g.psuScore===null || g.oppScore===null) return null;
  const sum = g.psuScore + g.oppScore;
  if(sum > Number(g.total)) return 'OVER';
  if(sum < Number(g.total)) return 'UNDER';
  return 'PUSH';
}
function lineLabel(g){
  if(g.psuLine===null || g.psuLine===undefined) return {psu:'Penn State', opp:'Opponent'};
  const l = Number(g.psuLine);
  if(l < 0) return {psu:`Penn State -${Math.abs(l)}`, opp:`Opponent +${Math.abs(l)}`};
  if(l > 0) return {psu:`Penn State +${l}`, opp:`Opponent -${l}`};
  return {psu:"Penn State (pick 'em)", opp:"Opponent (pick 'em)"};
}
function allPicksIn(gameId){
  const p = picks[gameId];
  if(!p) return false;
  return USERS.every(u => p[u] && p[u].ats && p[u].ou);
}

// ---------------- RENDER ----------------
function render(){
  if(activeTab==='schedule') renderSchedule();
  else if(activeTab==='picks') renderPicks();
  else renderStandings();
}

function nextUpcoming(){
  return games.find(g=>g.status!=='final');
}

function scoreboardHTML(){
  const nx = nextUpcoming();
  if(!nx){
    return `<div class="scoreboard">
      <div><div class="sb-label">Season Status</div><div class="sb-main">All games complete</div></div>
      <div class="sb-sub">Check Standings for final results</div>
    </div>`;
  }
  return `<div class="scoreboard">
    <div><div class="sb-label">Next Kickoff — Week ${nx.week}</div>
    <div class="sb-main">PSU ${nx.homeAway==='home'?'vs':'at'} ${nx.opponent.toUpperCase()}</div></div>
    <div class="sb-sub">${nx.date} · ${nx.time} · ${nx.tv}</div>
  </div>`;
}

function renderSchedule(){
  const main = document.getElementById('main-content');
  let html = scoreboardHTML();
  html += `<div class="section-title"><h2>Full Regular Season</h2><div class="rule"></div></div>`;

  games.forEach(g=>{
    const isFinal = g.status==='final';
    const ats = atsResult(g);
    const ou = ouResult(g);

    html += `<div class="card ${isFinal?'final':''}">
      <div class="card-head">
        <div class="gh-left">
          <div class="wk">Week ${g.week} · ${g.homeAway==='home'?'Home':'Away'}</div>
          <div class="matchup">Penn State ${g.homeAway==='home'?'vs.':'at'} ${g.opponent}</div>
          <div class="meta">${g.date} · ${g.time} · ${g.location}</div>
        </div>
        <div class="tv-badge">📺 ${g.tv}</div>
      </div>
      <div class="card-body">`;

    if(isFinal){
      html += `<div class="final-score">
          <span>PSU ${g.psuScore} — ${g.oppScore} ${g.opponent}</span>
        </div>
        <div class="line-row">
          <div class="line-item">Line was: <b>${g.psuLine===null?'—':(g.psuLine<0?'PSU -'+Math.abs(g.psuLine):(g.psuLine>0?'PSU +'+g.psuLine:'Even'))}</b></div>
          <div class="line-item">O/U was: <b>${g.total===null?'—':g.total}</b></div>
          ${ats?`<span class="result-tag ${ats==='PSU'?'psu':(ats==='OPP'?'opp':'push')}">${ats==='PSU'?'PSU covered':(ats==='OPP'?g.opponent+' covered':'Push')}</span>`:''}
          ${ou?`<span class="result-tag ${ou==='OVER'?'psu':(ou==='UNDER'?'opp':'push')}">${ou==='PUSH'?'O/U Push':ou}</span>`:''}
        </div>`;
      if(isAdmin){
        html += `<div class="admin-controls">
          <button class="small-btn ghost" onclick="toggleScoreEdit(${g.id})">${editingScore[g.id]?'Cancel':'Edit Final Score'}</button>
        </div>`;
        if(editingScore[g.id]){
          html += `<div class="edit-box">
            <div class="edit-row">
              <div class="field"><label>PSU Score</label><input type="number" id="score-psu-${g.id}" value="${g.psuScore===null?'':g.psuScore}"></div>
              <div class="field"><label>${g.opponent} Score</label><input type="number" id="score-opp-${g.id}" value="${g.oppScore===null?'':g.oppScore}"></div>
              <button class="small-btn" onclick="saveScore(${g.id})">Save</button>
            </div>
          </div>`;
        }
      }
    } else {
      html += `<div class="line-row">
          <div class="line-item">Spread: <b>${g.psuLine===null?'Not set':(g.psuLine<0?'PSU -'+Math.abs(g.psuLine):(g.psuLine>0?'PSU +'+g.psuLine:'Even'))}</b></div>
          <div class="line-item">O/U: <b>${g.total===null?'Not set':g.total}</b></div>
        </div>`;
      if(isAdmin){
        html += `<div class="admin-controls">
            <button class="small-btn ghost" onclick="toggleLineEdit(${g.id})">${editingLine[g.id]?'Cancel':'Set / Edit Line'}</button>
            <button class="small-btn ghost" onclick="toggleScoreEdit(${g.id})">${editingScore[g.id]?'Cancel':'Enter Final Score'}</button>
          </div>`;
        if(editingLine[g.id]){
          html += `<div class="edit-box">
            <div class="edit-row">
              <div class="field"><label>PSU Spread</label><input type="number" step="0.5" id="line-psu-${g.id}" placeholder="-14.5" value="${g.psuLine===null?'':g.psuLine}"></div>
              <div class="field"><label>Over/Under</label><input type="number" step="0.5" id="line-total-${g.id}" placeholder="47.5" value="${g.total===null?'':g.total}"></div>
              <button class="small-btn" onclick="saveLine(${g.id})">Save Line</button>
            </div>
            <div class="meta" style="margin-top:8px;">Enter PSU's spread as a negative number if PSU is favored (e.g. -14.5), positive if PSU is the underdog (e.g. 3).</div>
          </div>`;
        }
        if(editingScore[g.id]){
          html += `<div class="edit-box">
            <div class="edit-row">
              <div class="field"><label>PSU Score</label><input type="number" id="score-psu-${g.id}" value=""></div>
              <div class="field"><label>${g.opponent} Score</label><input type="number" id="score-opp-${g.id}" value=""></div>
              <button class="small-btn" onclick="saveScore(${g.id})">Mark Final</button>
            </div>
          </div>`;
        }
      }
    }
    html += `</div></div>`;
  });

  main.innerHTML = html;
}

function toggleLineEdit(id){ editingLine[id] = !editingLine[id]; editingScore[id] = false; render(); }
function toggleScoreEdit(id){ editingScore[id] = !editingScore[id]; editingLine[id] = false; render(); }

async function saveLine(id){
  if(!isAdmin) return;
  const psu = document.getElementById(`line-psu-${id}`).value;
  const tot = document.getElementById(`line-total-${id}`).value;
  const g = games.find(x=>x.id===id);
  g.psuLine = psu===''?null:Number(psu);
  g.total = tot===''?null:Number(tot);
  editingLine[id]=false;
  await saveGames();
  render();
}
async function saveScore(id){
  if(!isAdmin) return;
  const psu = document.getElementById(`score-psu-${id}`).value;
  const opp = document.getElementById(`score-opp-${id}`).value;
  if(psu===''||opp===''){ alert('Enter both scores.'); return; }
  const g = games.find(x=>x.id===id);
  g.psuScore = Number(psu);
  g.oppScore = Number(opp);
  g.status = 'final';
  editingScore[id]=false;
  await saveGames();
  render();
}

function renderPicks(){
  const main = document.getElementById('main-content');
  const open = games.filter(g=>g.status!=='final');
  const completed = games.filter(g=>g.status==='final');
  let html = `<div class="section-title"><h2>Make Your Picks</h2><div class="rule"></div></div>`;

  if(open.length===0){
    html += `<div class="empty-note">No open games right now.</div>`;
  }

  open.forEach(g=>{
    const ll = lineLabel(g);
    const hasLine = g.psuLine!==null && g.total!==null;
    const myPick = (picks[g.id] && picks[g.id][currentUser]) || {ats:null, ou:null};
    const revealed = !!g.locked;
    const inCount = USERS.filter(u=>picks[g.id]&&picks[g.id][u]&&picks[g.id][u].ats&&picks[g.id][u].ou).length;

    html += `<div class="card">
      <div class="card-head">
        <div class="gh-left">
          <div class="wk">Week ${g.week}</div>
          <div class="matchup">Penn State ${g.homeAway==='home'?'vs.':'at'} ${g.opponent}</div>
          <div class="meta">${g.date} · ${g.time} · ${g.tv}</div>
        </div>
      </div>
      <div class="card-body">`;

    if(!hasLine){
      html += `<div class="empty-note">Odds haven't been posted yet for this game — check back closer to kickoff.</div>`;
    } else if(revealed){
      html += `<div class="locked-note">🔒 Picks locked by admin — revealed below.</div>
        <div class="reveal-grid">
          <table class="reveal">
            <tr><th>Player</th><th>Against the Spread</th><th>Over / Under</th></tr>
            ${USERS.map(u=>{
              const p = picks[g.id] && picks[g.id][u];
              if(!p || !p.ats || !p.ou){
                return `<tr><td class="player-cell"><div class="avatar" style="width:22px;height:22px;font-size:10px;">${u.slice(0,2).toUpperCase()}</div><b>${u}</b>${u===currentUser?' (you)':''}</td>
                  <td colspan="2"><span class="pill">No pick submitted</span></td></tr>`;
              }
              return `<tr><td class="player-cell"><div class="avatar in" style="width:22px;height:22px;font-size:10px;">${u.slice(0,2).toUpperCase()}</div><b>${u}</b>${u===currentUser?' (you)':''}</td>
                <td>${p.ats==='PSU'?ll.psu:ll.opp}</td>
                <td>${p.ou} ${g.total}</td></tr>`;
            }).join('')}
          </table>
        </div>`;
      if(isAdmin){
        html += `<div class="admin-controls"><button class="small-btn ghost" onclick="toggleLock(${g.id})">🔓 Unlock (allow changes)</button></div>`;
      }
    } else {
      html += `<div class="pick-group-label">Against the Spread</div>
        <div class="pick-options">
          <button class="pick-opt ${myPick.ats==='PSU'?'selected':''}" onclick="setPick(${g.id},'ats','PSU')">
            <div class="po-title">${ll.psu}</div><div class="po-sub">Penn State covers</div>
          </button>
          <button class="pick-opt ${myPick.ats==='OPP'?'selected':''}" onclick="setPick(${g.id},'ats','OPP')">
            <div class="po-title">${ll.opp}</div><div class="po-sub">${g.opponent} covers</div>
          </button>
        </div>
        <div class="pick-group-label">Total Points — O/U ${g.total}</div>
        <div class="pick-options">
          <button class="pick-opt ${myPick.ou==='OVER'?'selected':''}" onclick="setPick(${g.id},'ou','OVER')">
            <div class="po-title">Over ${g.total}</div>
          </button>
          <button class="pick-opt ${myPick.ou==='UNDER'?'selected':''}" onclick="setPick(${g.id},'ou','UNDER')">
            <div class="po-title">Under ${g.total}</div>
          </button>
        </div>
        <div class="save-row">
          <button class="btn" style="width:auto;" onclick="submitPick(${g.id})">Save My Picks</button>
        </div>
        <div class="status-row">
          ${USERS.map(u=>{
            const in_ = picks[g.id] && picks[g.id][u] && picks[g.id][u].ats && picks[g.id][u].ou;
            return `<div class="avatar ${in_?'in':''}" title="${u}">${u.slice(0,2).toUpperCase()}</div>`;
          }).join('')}
          <span class="status-note">${inCount} of ${USERS.length} picks in — picks stay hidden until an admin locks them.</span>
        </div>`;
      if(isAdmin){
        html += `<div class="admin-controls">
          <button class="small-btn" onclick="toggleLock(${g.id})">🔒 Lock Picks${inCount<USERS.length?' Now (not everyone has picked yet)':' for Everyone'}</button>
        </div>`;
      }
    }
    html += `</div></div>`;
  });

  if(completed.length>0){
    html += `<div class="section-title"><h2>Completed Games — Results</h2><div class="rule"></div></div>`;
    completed.slice().reverse().forEach(g=>{
      const ll = lineLabel(g);
      const ats = atsResult(g);
      const ou = ouResult(g);
      html += `<div class="card final">
        <div class="card-head">
          <div class="gh-left">
            <div class="wk">Week ${g.week}</div>
            <div class="matchup">Penn State ${g.homeAway==='home'?'vs.':'at'} ${g.opponent}</div>
            <div class="meta">Final: PSU ${g.psuScore} — ${g.oppScore} ${g.opponent}</div>
          </div>
        </div>
        <div class="card-body">
          <div class="reveal-grid" style="border-top:none;padding-top:0;">
            <table class="reveal">
              <tr><th>Player</th><th>Against the Spread</th><th>Over / Under</th></tr>
              ${USERS.map(u=>{
                const p = picks[g.id] && picks[g.id][u];
                if(!p || !p.ats || !p.ou){
                  return `<tr><td class="player-cell"><div class="avatar" style="width:22px;height:22px;font-size:10px;">${u.slice(0,2).toUpperCase()}</div><b>${u}</b>${u===currentUser?' (you)':''}</td>
                    <td colspan="2"><span class="pill">No pick submitted</span></td></tr>`;
                }
                const atsRight = ats && ats!=='PUSH' && p.ats===ats;
                const atsWrong = ats && ats!=='PUSH' && p.ats!==ats;
                const ouRight = ou && ou!=='PUSH' && p.ou===ou;
                const ouWrong = ou && ou!=='PUSH' && p.ou!==ou;
                return `<tr><td class="player-cell"><div class="avatar in" style="width:22px;height:22px;font-size:10px;">${u.slice(0,2).toUpperCase()}</div><b>${u}</b>${u===currentUser?' (you)':''}</td>
                  <td><span class="pill ${atsRight?'correct':(atsWrong?'incorrect':'')}">${p.ats==='PSU'?ll.psu:ll.opp}</span></td>
                  <td><span class="pill ${ouRight?'correct':(ouWrong?'incorrect':'')}">${p.ou} ${g.total}</span></td></tr>`;
              }).join('')}
            </table>
          </div>
        </div>
      </div>`;
    });
  }

  main.innerHTML = html;
}

function setPick(gameId, kind, value){
  const g = games.find(x=>x.id===gameId);
  if(g && g.locked){ alert('Picks for this game are locked.'); render(); return; }
  picks[gameId] = picks[gameId] || {};
  picks[gameId][currentUser] = {...(picks[gameId][currentUser]||{}), [kind]:value};
  render();
}
async function submitPick(gameId){
  const g = games.find(x=>x.id===gameId);
  if(g && g.locked){ alert('Picks for this game are locked.'); render(); return; }
  const p = picks[gameId] && picks[gameId][currentUser];
  if(!p || !p.ats || !p.ou){ alert('Pick both the spread winner and the over/under before saving.'); return; }
  await savePicks();
  render();
}
async function toggleLock(gameId){
  if(!isAdmin) return;
  const g = games.find(x=>x.id===gameId);
  if(!g) return;
  g.locked = !g.locked;
  await saveGames();
  render();
}

function renderStandings(){
  const main = document.getElementById('main-content');
  const tally = {};
  USERS.forEach(u=> tally[u] = {pts:0, ats:0, ou:0});

  games.forEach(g=>{
    const ats = atsResult(g);
    const ou = ouResult(g);
    if(ats===null && ou===null) return;
    USERS.forEach(u=>{
      const p = picks[g.id] && picks[g.id][u];
      if(!p) return;
      if(ats && ats!=='PUSH' && p.ats===ats){ tally[u].pts++; tally[u].ats++; }
      if(ou && ou!=='PUSH' && p.ou===ou){ tally[u].pts++; tally[u].ou++; }
    });
  });

  const ranked = USERS.map(u=>({name:u, ...tally[u]})).sort((a,b)=>b.pts-a.pts);
  const maxPts = Math.max(1, ...ranked.map(r=>r.pts));

  let html = `<div class="section-title"><h2>Standings</h2><div class="rule"></div></div>`;
  html += `<div class="stand-legend" style="margin-bottom:14px;">
    <span><span class="legend-dot" style="background:var(--steel);"></span>Spread points</span>
    <span><span class="legend-dot" style="background:var(--amber);"></span>Over/Under points</span>
  </div>`;

  ranked.forEach((r,i)=>{
    const atsW = maxPts? (r.ats/maxPts*100):0;
    const ouW = maxPts? (r.ou/maxPts*100):0;
    html += `<div class="stand-card">
      <div class="stand-top">
        <div class="stand-name"><span class="rank-badge ${i===0?'gold':''}">${i+1}</span>${r.name}</div>
        <div class="stand-pts">${r.pts} pts</div>
      </div>
      <div class="bar-outer">
        <div class="bar-ats" style="width:${atsW}%"></div>
        <div class="bar-ou" style="width:${ouW}%"></div>
      </div>
      <div class="meta" style="margin-top:8px;">Spread: ${r.ats} correct &nbsp;·&nbsp; Over/Under: ${r.ou} correct</div>
    </div>`;
  });

  const anyFinal = games.some(g=>g.status==='final');
  if(!anyFinal){
    html += `<div class="empty-note">No games finished yet — standings will populate once results are entered.</div>`;
  }

  html += `<div class="footer-note">
    Ol' State Pick'em · 2026 Penn State Football · 1 point for a correct spread pick, 1 point for a correct over/under pick.`;
  if(isAdmin){
    html += `<br><button class="danger-link" onclick="resetSeason()">Reset all lines, scores &amp; picks</button>`;
  }
  html += `</div>`;

  main.innerHTML = html;
}

async function resetSeason(){
  if(!isAdmin) return;
  if(!confirm("This wipes all lines, scores, and everyone's picks for the whole season. Are you sure?")) return;
  games = JSON.parse(JSON.stringify(DEFAULT_GAMES));
  picks = {};
  await saveGames();
  await savePicks();
  render();
}
</script>
